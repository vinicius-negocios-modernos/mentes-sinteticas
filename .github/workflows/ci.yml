name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint → Typecheck → Test → Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # SYS-15 — supply-chain gate. Fails the build on any HIGH/critical
      # production vulnerability that is NOT explicitly waived below.
      # Waived: GHSA advisories for `next` (16.1.1 -> 16.2.6 minor bump),
      # deferred to a dedicated auth-critical-path test window (story TD-1.1).
      # Review the waiver when the Next bump lands; the goal is an empty list.
      - name: Security audit (npm audit gate)
        run: |
          node -e '
            const { execSync } = require("child_process");
            // Advisories deliberately waived (documented in story TD-1.1).
            // Keyed by package name; remove once the Next bump is applied.
            const WAIVED = new Set(["next", "postcss"]);
            let report;
            try {
              const out = execSync("npm audit --omit=dev --json", { encoding: "utf8" });
              report = JSON.parse(out);
            } catch (e) {
              // npm audit exits non-zero when vulns exist; parse stdout anyway.
              report = JSON.parse(e.stdout || "{}");
            }
            const vulns = report.vulnerabilities || {};
            const blocking = Object.entries(vulns).filter(([name, v]) =>
              (v.severity === "high" || v.severity === "critical") && !WAIVED.has(name)
            );
            if (blocking.length > 0) {
              console.error("Blocking HIGH/critical vulnerabilities (not waived):");
              blocking.forEach(([name, v]) => console.error(`  - ${name}: ${v.severity}`));
              process.exit(1);
            }
            const waivedHits = Object.entries(vulns).filter(([name, v]) =>
              (v.severity === "high" || v.severity === "critical") && WAIVED.has(name)
            );
            if (waivedHits.length > 0) {
              console.log("Waived HIGH/critical (tracked in story TD-1.1):");
              waivedHits.forEach(([name, v]) => console.log(`  - ${name}: ${v.severity}`));
            }
            console.log("Security audit gate passed (no un-waived HIGH/critical).");
          '

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
