name: Build and Push to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploy strategy: VPS runs a cron job (every 1 min) that pulls the latest
# image from GHCR and redeploys via `docker stack deploy` if a new image is
# detected. See /opt/mentes-sinteticas/auto-deploy.sh on the VPS.
#
# Database migrations: apply manually via SSH tunnel when needed.
#   ssh -L 15432:postgres_postgres:5432 root@76.13.82.80
#   psql -h localhost -p 15432 -U postgres -d mentes_sinteticas < drizzle/NNNN_migration.sql

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: vinicius-negocios-modernos/mentes-sinteticas

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # SYS-11 — Post-deploy smoke test (OPT-IN, additive).
  # This job is a no-op until you set the repo VARIABLE `SMOKE_BASE_URL`
  # (Settings → Secrets and variables → Actions → Variables) to the prod URL,
  # e.g. https://mentes.negociosmodernos.cloud. It does NOT gate the build/push
  # above (it `needs` it but failures here do not roll back the image). Because
  # the VPS auto-deploy cron pulls ~every 1 min, we wait, then probe the real
  # critical paths (/api/health + homepage + /api/chat liveness). A 5xx on
  # /api/chat fails the smoke — the exact gap a `GET /` healthcheck misses.
  #
  # Optional: set the SECRET `SMOKE_AUTH_COOKIE` to a valid session cookie to
  # exercise the real authenticated Gemini path instead of just liveness.
  smoke:
    name: Post-deploy smoke test (opt-in)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ vars.SMOKE_BASE_URL != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for VPS auto-deploy cron to roll the new image
        run: sleep "${{ vars.SMOKE_WAIT_SECONDS || '120' }}"

      - name: Run smoke test against production
        env:
          BASE_URL: ${{ vars.SMOKE_BASE_URL }}
          SMOKE_AUTH_COOKIE: ${{ secrets.SMOKE_AUTH_COOKIE }}
        run: bash scripts/smoke-test.sh "$BASE_URL"
